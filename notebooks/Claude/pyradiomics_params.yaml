# =============================================================================
# PyRadiomics Parameter Configuration
# Study  : RCC vs. AML Classification — Renal Radiomics
# Datasets: KiTS23 (NIfTI) + UCSF RMAC (HDF5)
#
# This file is shared by Notebook 3 (KiTS23) and Notebook 4 (UCSF).
# Using the same parameter file for both datasets guarantees that every
# feature is computed under identical conditions, making features
# directly comparable across datasets for ML modeling.
# =============================================================================

setting:

  # ---------------------------------------------------------------------------
  # RESAMPLING TO COMMON VOXEL SPACING
  # ---------------------------------------------------------------------------
  # Why needed:
  #   KiTS23 native spacing: ~0.78 x 0.78 x 3.0 mm (per-scanner, varies)
  #   UCSF native spacing:    0.76 x 0.76 x 5.0 mm (GE Revolution HD)
  #
  #   Even after setting UCSF spacing correctly from HDF5 attributes,
  #   the two datasets still have different through-plane resolution
  #   (3.0 mm vs 5.0 mm). Shape and texture features computed on different
  #   voxel grids are not directly comparable.
  #
  #   Resampling both datasets to 1x1x1 mm isotropic before extraction
  #   ensures every feature is computed on the same geometric grid.
  #
  # Why 1mm isotropic:
  #   Standard target spacing in renal CT radiomics literature.
  #   Sits between both datasets' native in-plane resolutions (~0.76-0.78mm).
  #   Makes results comparable to published renal radiomics studies.
  # ---------------------------------------------------------------------------
  resampledPixelSpacing: [1, 1, 1]

  # B-spline for image resampling — smooth, clinically standard
  interpolator: sitkBSpline

  # Nearest-neighbor for mask resampling — preserves binary 0/1 values
  interpolatorMask: sitkNearestNeighbor

  # ---------------------------------------------------------------------------
  # BIN WIDTH — Standardizes texture feature computation
  # ---------------------------------------------------------------------------
  # Why needed:
  #   GLCM, GLRLM, GLSZM, NGTDM all require discretizing CT Hounsfield Unit
  #   values into intensity bins before computing co-occurrence matrices.
  #   Without a fixed binWidth, PyRadiomics uses a fixed bin count, meaning
  #   bin width adapts to each image's HU range. Two scans of the same tissue
  #   with slightly different HU ranges produce different texture matrices —
  #   not because tissue differs, but because binning differs.
  #
  # Why 25 HU:
  #   Standard for abdominal CT in published renal radiomics literature.
  #   Appropriate for the HU range of kidney tumors (~-100 to +200 HU).
  #   AML contains macroscopic fat (low HU ~-100); RCC spans +20 to +80 HU.
  # ---------------------------------------------------------------------------
  binWidth: 25

  # ---------------------------------------------------------------------------
  # OUTLIER REMOVAL
  # ---------------------------------------------------------------------------
  # Removes voxels with intensity > 3 standard deviations from the mean
  # before computing first-order statistics.
  #
  # Why needed:
  #   AML tumors contain macroscopic fat (~-100 HU) creating extreme low-HU
  #   outliers. Without removal, a small number of fat voxels can dominate
  #   first-order features like Mean, Energy, and Kurtosis.
  # ---------------------------------------------------------------------------
  removeOutliers: 3

  # ---------------------------------------------------------------------------
  # PAD DISTANCE
  # ---------------------------------------------------------------------------
  # Adds 10 voxels of padding around the mask bounding box.
  #
  # Why needed:
  #   After resampling, tumors near the image boundary may have insufficient
  #   surrounding voxels. Texture features that sample neighboring voxels
  #   can be distorted by edge effects without adequate padding.
  # ---------------------------------------------------------------------------
  padDistance: 10

  # Minimum mask size — prevents crashes on over-eroded augmented masks
  minimumROIDimensions: 2
  minimumROISize: 50


# =============================================================================
# FEATURE CLASSES
# Explicit declaration of which feature groups to extract.
# Without this, PyRadiomics extracts all classes including unstable ones.
# Being explicit ensures reproducibility across runs and environments.
# =============================================================================
featureClass:

  # 3D geometry: volume, surface area, elongation, sphericity, diameters
  # AML tends to be rounder and well-circumscribed; RCC more irregular
  shape:

  # Intensity statistics: mean, variance, entropy, kurtosis, skewness
  # AML fat content produces distinct HU distribution vs RCC
  firstorder:

  # Co-occurrence matrix: homogeneity, contrast, correlation, energy
  # Captures internal texture heterogeneity differences
  glcm:

  # Run-length matrix: coarseness, directional streaks
  # Captures fibrous or vascular architectural patterns
  glrlm:

  # Zone-size matrix: tissue fragmentation, cluster size distribution
  # Large homogeneous fat zones (AML) vs fragmented zones (RCC)
  glszm:

  # Neighborhood tone difference: visual complexity, chaos
  # Overall organized vs chaotic internal texture
  ngtdm:


# =============================================================================
# IMAGE TYPE
# Extract features from the original image only.
# Wavelet or Laplacian of Gaussian (LoG) filters can be added here
# in future studies for multi-scale feature extraction.
# =============================================================================
imageType:
  Original:
